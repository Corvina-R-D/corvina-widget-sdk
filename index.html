<!DOCTYPE html>
<html lang="en" style="height: 100vh; overflow-y: auto">
  <head>
    <meta charset="utf-8">
    <style>
      #app-loader{
        position: absolute;
        top: 0px;
        width: 100%;
        min-height: 100%;
        z-index: 1000;
        background-color: rgba(255,255,255, 0.2);
        backdrop-filter: blur(5px);
      }
      #app-loader .app-loader-spinner {
        position: absolute;
        top: 50%; left: 50%;
        transform: translate(-50%,-50%);
        border: 4px solid #f3f3f3; 
        border-top: 4px solid #a3a3a3;
        border-radius: 50%;
        width: 50px;
        height: 50px;
        animation: app-loader-spin 0.8s linear infinite;
        box-sizing: content-box;
      }
      @keyframes app-loader-spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
    <title>Corvina</title>
    <link rel="shortcut icon" type="image/png" href="https://app.corvina.io/static/img/favicon.ico"/>
    <!--
      Corvina runtime: the released one, or a local build of corvina-frontend with yarn dev:local
      (corvinaRuntime in webpack.config.js, see doc/update_sdk.md)
    -->
    <% var corvinaRuntime = htmlWebpackPlugin.options.corvinaRuntime || "https://app.corvina.io/dist/"; %>
    <script type="text/javascript" src="<%= corvinaRuntime %>static.js"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700,400italic|Material+Icons">
  </head>
  <script defer >

    // We need multiple entrypoints, and also need runtime isolation (runtimeChunk: false)
    // So, there are multiple HMR runtimes, one per entrypoint, and the last one initialized will override the same global
    // function webpackHotUpdatevuex_corvina_app
    // The suggested solution would be to use runtimeChunk: 'single', but that would break widget isolation
    // So here we provide a specific overwrite to ensure that the HMR works for lib and init


    // Dispatch the HMR updates to the correct runtime
    window.__webpackHotUpdatevuex_corvina_app = function( chunkId, moreModules, runtime ) {
      console.log("HMR custom update: override called", chunkId, moreModules, runtime);
      if (moreModules && (chunkId == "lib" ||  Object.keys(moreModules).find( m => m.toString().indexOf("./src/")>=0 )) ) {
        console.log("HMR custom update: select lib changes", chunkId, moreModules);
        return window.__webpackHotUpdatevuex_corvina_app_lib( chunkId, moreModules, runtime );
      }

      if (moreModules && (chunkId == "init" || Object.keys(moreModules).find( m => m.toString().indexOf("./index")>=0 )) ) {
        console.log("HMR custom update: selected index changes", chunkId, moreModules);
        return window.__webpackHotUpdatevuex_corvina_app_init( chunkId, moreModules, runtime );
      }

      console.log("HMR custom update: unknown changes, ignoring", chunkId, moreModules);
    }

    // save HMR of specific entrypoints
    Object.defineProperty(window, 'webpackHotUpdatevuex_corvina_app', {
      configurable: true,
      enumerable: true,
      get() {
        // return our custom implementation that dispatches to the correct runtime (either lib or init)
        return window.__webpackHotUpdatevuex_corvina_app;
      },
      set(value) {
        console.log('Intercepted write to window.webpackHotUpdatevuex_corvina_app');

        const stack = new Error().stack;
        if (stack && stack.includes('lib.js')) {
          window.__webpackHotUpdatevuex_corvina_app_lib = value;
        } else if (stack && stack.includes('init.js')) {
          window.__webpackHotUpdatevuex_corvina_app_init = value;
        } else {
          console.warn("webpackHotUpdatevuex_corvina_app set from unknown source", stack);
        }
      }
    });
  </script>

  <script defer src="/static/sdk_pre.js"></script>

  <script defer src="/static/sdk_post.js"></script></head>



  <script>
    const url = new URL(location.href);
    const redirectHostname = url.searchParams.get("corvina-login-hostname");
    url.searchParams.delete("corvina-login-hostname");
    const defOrgMatch = document.cookie.match(/ccdeforg=([^;]*);/);  
    if (redirectHostname && defOrgMatch.length > 1 && redirectHostname != defOrgMatch[1]) {
      url.host = `${redirectHostname}.${url.host}`;
      location.href = url.toString();
    }
    if (typeof Keycloak !== "undefined") {
      window.$Keycloak = Keycloak;
    }
  </script>
  <body style="width:100%; min-height: 100vh">
    <script>
    var adjustPath = function( path ) {
        return path;
    };
    </script>
    <div id="app"></div>        
    <script type="text/javascript" src="<%= corvinaRuntime %>sdk-runtime.js"></script>
    <script type="text/javascript" type="module" src="<%= corvinaRuntime %>sdk-vue.js"></script>
    <script type="text/javascript" src="<%= corvinaRuntime %>sdk-BrandData.js"></script>
    <script type="text/javascript" type="module" src="<%= corvinaRuntime %>sdk-corvina.js"></script>
    <script type="text/javascript">
      // Keep UMD globals from SDK in temporary variables, as they will be overridden by the app's own webpack runtimes
      window.__sdk_module = window.module;
      window.__sdk_exports = window.exports;
      window.module = undefined;
      window.exports = undefined;
    </script>
    <script type="text/javascript" src="/dist/org/lib.js"></script>
    <script type="text/javascript" src="/dist/org/init.js"></script>
    <script type="text/javascript">
      // Restore the SDK UMD globals, as they might be needed by the app's webpack runtimes (e.g. for HMR)
      window.module = window.__sdk_module;
      window.exports = window.__sdk_exports;
      delete window.__sdk_module;
      delete window.__sdk_exports;
    </script>
    <script type="text/javascript">
      window.__webpackHotUpdatevuex_corvina_app_init = window.webpackHotUpdatevuex_corvina_app
    </script>
  </body>
</html>
